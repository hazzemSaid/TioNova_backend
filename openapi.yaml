openapi: 3.1.0
info:
  title: Authentication API
  description: Authentication and user management endpoints
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local dev server

tags:
  - name: Auth
    description: User authentication & authorization

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Registration successful, verification email sent
        "409":
          description: User already exists
        "422":
          description: Validation error

  /auth/verify-email:
    post:
      summary: Verify email with code
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
      responses:
        "200":
          description: Email verified successfully
        "400":
          description: User already verified or no code found
        "401":
          description: Invalid/expired code
        "404":
          description: User not found

  /auth/resend-verification:
    post:
      summary: Resend verification code
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Code resent successfully
        "400":
          description: Already verified
        "404":
          description: User not found

  /auth/login:
    post:
      summary: Login with email and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful, returns tokens
        "401":
          description: Invalid credentials or unverified email
        "422":
          description: Validation error

  /auth/refresh-token:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Returns new access and refresh tokens
        "401":
          description: Invalid or expired refresh token
        "404":
          description: User not found

  /auth/google:
    post:
      summary: Authenticate with Google
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Google ID token
      responses:
        "200":
          description: Login successful
        "201":
          description: New user created
        "401":
          description: Invalid Google token

  /auth/forgot-password:
    post:
      summary: Request password reset
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Reset code sent (or success response even if email not found)

  /auth/verify-code:
    post:
      summary: Verify reset code
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
      responses:
        "200":
          description: Code verified successfully
        "400":
          description: Invalid reset request
        "401":
          description: Invalid/expired code or token

  /auth/reset-password:
    post:
      summary: Reset user password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Password reset successfully
        "400":
          description: Invalid reset request
        "401":
          description: Invalid/expired code or token

  /auth/logout:
    post:
      summary: Logout user (invalidate refresh token)
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
