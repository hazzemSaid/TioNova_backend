services:
  - type: web
    name: tionova-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URI
        fromDatabase:
          name: tionova-mongodb
          property: connectionString
      - key: mongodbUsername
        sync: false
      - key: mongodbPassword
        sync: false
      - key: SALT_ROUNDS
        value: 12
      - key: JWT_SECRET
        generateValue: true
        length: 64
      - key: JWT_REFRESH_SECRET
        generateValue: true
        length: 64
      - key: MAILTRAP_TOKEN
        sync: false
      - key: Cloudname
        sync: false
      - key: APIkey
        sync: false
      - key: APIsecret
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: REDIS_URL
        sync: false
      - key: API_KEY_GEMINI
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

  # Background Worker Service for BullMQ
  - type: worker
    name: tionova-worker
    env: node
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        sync: false
      - key: MONGO_URI
        fromDatabase:
          name: tionova-mongodb
          property: connectionString
      - key: API_KEY_GEMINI
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

databases:
  - name: tionova-mongodb
    databaseName: tionova
    user: tionova-user